[project]
name = "tg-channel-parser"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.142.2",
    "starlette>=1.3.1",
    "uvicorn[standard]==0.32.0",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "pydantic==2.10.0",
    "pydantic-settings==2.6.0",
    "loguru==0.7.2",
    "httpx==0.28.0",
    "pyrogram==2.0.106",
    "tgcrypto==1.2.5",
]

[dependency-groups]
dev = [
    "pytest==8.3.0",
    "pytest-asyncio==0.24.0",
    "ruff==0.6.9",
    "mypy==1.11.2",
    "pre-commit==3.8.0",
    "pip-audit>=2.10.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = ["app/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501", "B008", "UP042"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
plugins = []
exclude = ["app/migrations"]

[[tool.mypy.overrides]]
module = ["pyrogram.*", "apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "acceptance: parser API scenarios against PostgreSQL",
]
