services:
  tg-parser-postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tg_parser}
      POSTGRES_USER: ${POSTGRES_USER:-tg_parser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - tg_parser_pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tg_parser} -d ${POSTGRES_DB:-tg_parser}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  tg-listener:
    build:
      context: .
      dockerfile: Dockerfile.listener
    env_file: .env
    command: ["python", "-m", "app.mtproto.realtime"]
    depends_on:
      tg-parser-postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - media_tmp:/tmp/media

  tg-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: .env
    command: ["python", "-m", "app.worker.task_worker"]
    depends_on:
      tg-parser-postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - media_tmp:/tmp/media
      - media_local:/data/media

  tg-parser-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    ports:
      - "127.0.0.1:8081:8000"
    depends_on:
      tg-parser-postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  tg_parser_pg_data:
  media_tmp:
  media_local:
