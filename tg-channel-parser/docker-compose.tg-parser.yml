x-app-environment: &app-environment
  DATABASE_URL: ${DATABASE_URL:?required}
  TELEGRAM_API_ID: ${TELEGRAM_API_ID:?required}
  TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?required}
  TELEGRAM_SESSION_STRING: ${TELEGRAM_SESSION_STRING:?required}
  API_AUTH_TOKEN: ${API_AUTH_TOKEN:?required}
  MEDIA_STORAGE_BACKEND: ${MEDIA_STORAGE_BACKEND:-local}
  MEDIA_LOCAL_PATH: ${MEDIA_LOCAL_PATH:-/data/media}
  MEDIA_TMP_PATH: ${MEDIA_TMP_PATH:-/tmp/media}
  TASK_POLL_INTERVAL_SECONDS: ${TASK_POLL_INTERVAL_SECONDS:-2}
  MEDIA_MAX_RETRIES: ${MEDIA_MAX_RETRIES:-3}
  MEDIA_RETRY_BACKOFF_BASE_SECONDS: ${MEDIA_RETRY_BACKOFF_BASE_SECONDS:-5}
  TASK_STALE_PROCESSING_MINUTES: ${TASK_STALE_PROCESSING_MINUTES:-15}
  MAX_MEDIA_BYTES: ${MAX_MEDIA_BYTES:-52428800}
  TZ: ${TZ:-Europe/Moscow}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
  DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
  DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
  DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}

services:
  tg-parser-postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tg_parser}
      POSTGRES_USER: ${POSTGRES_USER:-tg_parser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - tg_parser_pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-tg_parser} -d ${POSTGRES_DB:-tg_parser}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  tg-parser-migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      <<: *app-environment
    command: ["alembic", "upgrade", "head"]
    depends_on:
      tg-parser-postgres:
        condition: service_healthy
    restart: "no"

  tg-listener:
    build:
      context: .
      dockerfile: Dockerfile.listener
    environment:
      <<: *app-environment
    command: ["python", "-m", "app.mtproto.realtime"]
    depends_on:
      tg-parser-postgres:
        condition: service_healthy
      tg-parser-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    volumes:
      - media_tmp:/tmp/media
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  tg-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      <<: *app-environment
    command: ["python", "-m", "app.worker.task_worker"]
    depends_on:
      tg-parser-postgres:
        condition: service_healthy
      tg-parser-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    volumes:
      - media_tmp:/tmp/media
      - media_local:/data/media
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  tg-parser-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      <<: *app-environment
    depends_on:
      tg-parser-postgres:
        condition: service_healthy
      tg-parser-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  tg_parser_pg_data:
  media_tmp:
  media_local:
