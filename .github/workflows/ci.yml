name: backend-ci

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: zakupki_test
          POSTGRES_USER: zakupki
          POSTGRES_PASSWORD: zakupki
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zakupki -d zakupki_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://zakupki:zakupki@localhost:5432/zakupki_test
      TELEGRAM_BOT_TOKEN: test-bot-token
      WEBHOOK_SECRET: test-webhook-secret
      TELEGRAM_WEBHOOK_SECRET_TOKEN: test-telegram-webhook-secret
      SCHEDULER_ENABLED: "false"
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff mypy
      - name: Ruff
        run: ruff check --config backend/pyproject.toml backend/app backend/tests
      - name: Mypy
        run: mypy backend/app --config-file backend/pyproject.toml
      - name: Pytest
        run: pytest backend/tests -q --rootdir=backend
