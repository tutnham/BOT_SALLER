name: ci

on:
  push:
    paths:
      - "backend/**"
      - "tg-channel-parser/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "tg-channel-parser/**"
      - ".github/workflows/ci.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: zakupki_test
          POSTGRES_USER: zakupki
          POSTGRES_PASSWORD: zakupki
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zakupki -d zakupki_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://zakupki:zakupki@localhost:5432/zakupki_test
      TELEGRAM_BOT_TOKEN: test-bot-token
      WEBHOOK_SECRET: test-webhook-secret
      TELEGRAM_WEBHOOK_SECRET_TOKEN: test-telegram-webhook-secret
      SCHEDULER_ENABLED: "false"
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff mypy
      - name: Ruff
        working-directory: backend
        run: ruff check app tests
      - name: Mypy
        working-directory: backend
        run: mypy app --config-file pyproject.toml
      - name: Pytest
        working-directory: backend
        run: pytest tests -q

  tg-channel-parser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: tg_parser_test
          POSTGRES_USER: tg_parser
          POSTGRES_PASSWORD: tg_parser
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tg_parser -d tg_parser_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://tg_parser:tg_parser@localhost:5432/tg_parser_test
      PARSER_TEST_DATABASE_URL: postgresql+asyncpg://tg_parser:tg_parser@localhost:5432/tg_parser_test
      API_AUTH_TOKEN: test-parser-api-token
      TELEGRAM_API_ID: "12345"
      TELEGRAM_API_HASH: "0123456789abcdef0123456789abcdef"
      TELEGRAM_SESSION_STRING: "test-session-string-not-real"
      PYTHONPATH: ${{ github.workspace }}/tg-channel-parser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tg-channel-parser/requirements.txt
          pip install ruff mypy
      - name: Ruff
        working-directory: tg-channel-parser
        run: ruff check app tests
      - name: Mypy
        working-directory: tg-channel-parser
        run: mypy app --config-file pyproject.toml
      - name: Alembic upgrade
        working-directory: tg-channel-parser
        run: alembic upgrade head
      - name: Pytest
        working-directory: tg-channel-parser
        run: pytest tests -q
