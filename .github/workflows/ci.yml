name: ci

on:
  push:
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Doc link check
        run: python scripts/check_doc_links.py

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: zakupki_test
          POSTGRES_USER: zakupki
          POSTGRES_PASSWORD: zakupki
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zakupki -d zakupki_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://zakupki:zakupki@localhost:5432/zakupki_test
      TELEGRAM_BOT_TOKEN: test-bot-token
      WEBHOOK_SECRET: test-webhook-secret
      TELEGRAM_WEBHOOK_SECRET_TOKEN: test-telegram-webhook-secret
      SCHEDULER_ENABLED: "false"
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen --all-groups --python 3.11
      - name: Ruff
        working-directory: backend
        run: uv run ruff check app tests
      - name: Mypy
        working-directory: backend
        run: uv run mypy app --config-file pyproject.toml
      - name: Alembic upgrade
        working-directory: backend
        run: uv run alembic upgrade head
      - name: Pytest
        working-directory: backend
        run: uv run pytest tests -q
      - name: pip-audit (backend)
        working-directory: backend
        run: uv run pip-audit -r requirements.txt --desc on
      - name: Alembic upgrade from previous revision
        working-directory: backend
        # Parent of head in git. Replace after `alembic current` on production.
        env:
          PREV_REVISION: "0013_deal_request_unique_binding_checks"
        run: |
          uv run alembic downgrade "$PREV_REVISION"
          uv run alembic upgrade head

  tg-channel-parser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: tg_parser_test
          POSTGRES_USER: tg_parser
          POSTGRES_PASSWORD: tg_parser
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tg_parser -d tg_parser_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://tg_parser:tg_parser@localhost:5432/tg_parser_test
      PARSER_TEST_DATABASE_URL: postgresql+asyncpg://tg_parser:tg_parser@localhost:5432/tg_parser_test
      API_AUTH_TOKEN: test-parser-api-token
      TELEGRAM_API_ID: "12345"
      TELEGRAM_API_HASH: "0123456789abcdef0123456789abcdef"
      TELEGRAM_SESSION_STRING: "test-session-string-not-real"
      PYTHONPATH: ${{ github.workspace }}/tg-channel-parser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        working-directory: tg-channel-parser
        run: uv sync --frozen --all-groups --python 3.11
      - name: Ruff
        working-directory: tg-channel-parser
        run: uv run ruff check app tests
      - name: Mypy
        working-directory: tg-channel-parser
        run: uv run mypy app --config-file pyproject.toml
      - name: Alembic upgrade
        working-directory: tg-channel-parser
        run: uv run alembic upgrade head
      - name: Pytest
        working-directory: tg-channel-parser
        run: uv run pytest tests -q
      - name: pip-audit (parser)
        working-directory: tg-channel-parser
        run: uv run pip-audit -r requirements.txt --desc on
      - name: Alembic upgrade from previous revision
        working-directory: tg-channel-parser
        # Parent of head in git. Replace after `alembic current` on production.
        env:
          PREV_REVISION: "0003_task_fk_and_posts_index"
        run: |
          uv run alembic downgrade "$PREV_REVISION"
          uv run alembic upgrade head

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t zakupki-backend:ci backend
      - name: Backend image smoke
        run: sh scripts/image_smoke.sh zakupki-backend:ci app.main app.workers.main
      - name: Trivy backend
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: zakupki-backend:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore
      - name: Build parser API image
        run: docker build -f tg-channel-parser/Dockerfile.api -t tg-parser-api:ci tg-channel-parser
      - name: Parser API image smoke
        run: sh scripts/image_smoke.sh tg-parser-api:ci app.api.main
      - name: Trivy parser API
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: tg-parser-api:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore
      - name: Build parser runtime image
        run: docker build -f tg-channel-parser/Dockerfile.runtime -t tg-parser-runtime:ci tg-channel-parser
      - name: Parser runtime image smoke
        run: sh scripts/image_smoke.sh tg-parser-runtime:ci app.mtproto.runtime
      - name: Trivy parser runtime
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: tg-parser-runtime:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        env:
          POSTGRES_USER: zakupki
          POSTGRES_PASSWORD: zakupki
          POSTGRES_DB: zakupki
          DATABASE_URL: postgresql+asyncpg://zakupki:zakupki@postgres:5432/zakupki
          WEBHOOK_SECRET: test-webhook-secret
          TELEGRAM_WEBHOOK_SECRET_TOKEN: test-telegram-webhook-secret
          TELEGRAM_API_ID: "12345"
          TELEGRAM_API_HASH: 0123456789abcdef0123456789abcdef
          TELEGRAM_SESSION_STRING: test-session-string-not-real
          API_AUTH_TOKEN: test-parser-api-token
        run: |
          touch .env
          docker compose -f docker-compose.yml config >/dev/null
          docker compose -f tg-channel-parser/docker-compose.tg-parser.yml --env-file /dev/null config >/dev/null

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
